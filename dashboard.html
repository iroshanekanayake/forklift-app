<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Manager Dashboard - Lion Beer Forklift Logs</title>
<style>
  body { font-family: Arial, sans-serif; margin: 15px; background: #f1f5f9; color: #0f172a; }
  .header { background: #d97706; color: white; padding: 15px 20px; border-radius: 8px; display: flex; justify-content: space-between; align-items: center; }
  h2 { margin: 0; font-size: 20px; }
  .card-container { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 15px; margin-top: 15px; }
  .card { background: white; border-radius: 8px; padding: 15px; border-left: 6px solid #16a34a; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
  .card.has-issue { border-left-color: #dc2626; background: #fef2f2; }
  .card-title { font-weight: bold; font-size: 18px; color: #1e293b; display: flex; justify-content: space-between; }
  .badge { padding: 4px 8px; border-radius: 4px; font-size: 12px; font-weight: bold; color: white; }
  .badge-good { background: #16a34a; }
  .badge-bad { background: #dc2626; }
  .info { font-size: 13px; color: #475569; margin: 4px 0; }
  .btn-print { margin-top: 10px; width: 100%; padding: 8px; background: #0284c7; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; }
  
  @media print {
    body { background: white; margin: 0; }
    .header, .btn-print { display: none; }
    .card-container { display: block; }
    .card { page-break-inside: avoid; border: 1px solid #ccc; margin-bottom: 20px; }
  }
</style>
</head>
<body>

<div class="header">
  <div>
    <h2>FORKLIFT PRE-CHECK LOGS</h2>
    <small>Lion Beer Company Management Dashboard</small>
  </div>
  <button onclick="window.print()" style="padding: 8px 15px; font-weight:bold; cursor:pointer;">Print / Save PDF</button>
</div>

<div class="card-container" id="logsContainer">
  <p>Loading inspection logs...</p>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyCeDKeig25MB0iwawWna2891Fx52wM7Jyk",
    authDomain: "forkliftapp-6ca94.firebaseapp.com",
    databaseURL: "https://forkliftapp-6ca94-default-rtdb.firebaseio.com",
    projectId: "forkliftapp-6ca94",
    storageBucket: "forkliftapp-6ca94.firebasestorage.app",
    messagingSenderId: "571222355847",
    appId: "1:571222355847:web:67cb10919b7e1d3b0f2d22",
    measurementId: "G-5NBG4590TH"
  };

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);

  const container = document.getElementById('logsContainer');
  const logsRef = ref(db, 'checklists');

  onValue(logsRef, (snapshot) => {
    container.innerHTML = '';
    const data = snapshot.val();
    
    if(!data) {
      container.innerHTML = '<p>No checklists submitted yet.</p>';
      return;
    }

    Object.keys(data).reverse().forEach(key => {
      const log = data[key];
      const card = document.createElement('div');
      card.className = `card ${log.hasIssue ? 'has-issue' : ''}`;
      
      let badItems = [];
      if(log.checks) {
        Object.keys(log.checks).forEach(k => {
          if(log.checks[k] === 'Not Good') badItems.push(k);
        });
      }

      card.innerHTML = `
        <div class="card-title">
          <span>${log.forkliftNo} (${log.model || 'Gas'})</span>
          <span class="badge ${log.hasIssue ? 'badge-bad' : 'badge-good'}">
            ${log.hasIssue ? 'ATTENTION REQUIRED' : 'PASSED'}
          </span>
        </div>
        <div class="info"><b>Date:</b> ${log.date} | <b>Shift:</b> ${log.shift}</div>
        <div class="info"><b>Operator:</b> ${log.operator} | <b>Supervisor:</b> ${log.supervisor}</div>
        <div class="info"><b>Owner:</b> ${log.owner} | <b>Mileage:</b> ${log.mileage} KM</div>
        ${log.hasIssue ? `<div class="info" style="color:#dc2626;"><b>Faults Detected:</b> ${badItems.join(', ')}</div>` : ''}
        ${log.overallRemarks ? `<div class="info"><b>Remarks:</b> ${log.overallRemarks}</div>` : ''}
        <button class="btn-print" onclick="window.print()">Print Report</button>
      `;
      container.appendChild(card);
    });
  });
</script>
</body>
</html>
