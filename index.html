<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forklift Pre-Check List - Lion Beer</title>
<!-- PWA Setup -->
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#1e3a8a">
<meta name="mobile-web-app-capable" content="yes">
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js');
    });
  }
</script>

<style>
  * { box-sizing: border-box; }
  body { font-family: Arial, sans-serif; margin: 12px; background-color: #f8fafc; color: #1e293b; }
  .container { max-width: 850px; margin: auto; background: white; padding: 18px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); border-top: 5px solid #d97706; }
  
  .tabs { display: flex; gap: 6px; margin-bottom: 15px; border-bottom: 2px solid #e2e8f0; padding-bottom: 8px; }
  .tab-btn { flex: 1; padding: 10px 4px; font-weight: bold; font-size: 14px; border: none; background: #f1f5f9; color: #475569; border-radius: 8px; cursor: pointer; text-align: center; }
  .tab-btn.active { background: #d97706; color: white; }
  
  .tab-content { display: none; }
  .tab-content.active { display: block; }

  h2 { text-align: center; margin: 5px 0 2px 0; color: #d97706; font-size: 22px; font-weight: 800; letter-spacing: 0.5px; }
  .company-sub { text-align: center; margin-top:0; font-size: 13px; font-weight: bold; color: #15803d; letter-spacing: 1px; }

  .grid-fields { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; background: #fef3c7; padding: 14px; border-radius: 10px; margin-bottom: 15px; border: 1px solid #fde68a; }
  .field { display: flex; flex-direction: column; }
  .field label { font-size: 12px; font-weight: bold; margin-bottom: 4px; color: #78350f; }
  select, input { padding: 10px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 15px; background: white; width: 100%; }

  .date-scroll-wrap { overflow-x: auto; display: flex; gap: 6px; padding: 6px 0; margin-top: 4px; }
  .date-btn { flex: 0 0 auto; min-width: 42px; height: 42px; border: 1px solid #cbd5e1; background: white; border-radius: 8px; font-weight: bold; font-size: 15px; cursor: pointer; }
  .date-btn.active { background: #15803d; color: white; border-color: #15803d; }

  .pill-group { display: flex; flex-wrap: wrap; gap: 6px; }
  .pill-item { flex: 1 1 calc(33.33% - 6px); min-width: 80px; text-align: center; }
  .pill-item input { display: none; }
  .pill-item label { display: block; padding: 8px 4px; border: 1px solid #cbd5e1; border-radius: 6px; background: white; font-weight: bold; cursor: pointer; font-size: 13px; width: 100%; box-sizing: border-box; }
  .pill-item input:checked + label { border-color: #15803d; background: #f0fdf4; color: #15803d; }

  table { width: 100%; border-collapse: collapse; margin-bottom: 15px; }
  th, td { border: 1px solid #cbd5e1; padding: 10px; text-align: left; font-size: 14px; }
  th { background-color: #d97706; color: white; text-align: center; }
  
  .remark-input { width: 100%; height: 50px; padding: 10px; font-size: 15px; font-weight: bold; color: #0f172a; border: 1px solid #94a3b8; border-radius: 6px; background: #fffdf0; resize: vertical; transition: all 0.2s ease-in-out; }
  .remark-input:focus { height: 90px !important; background: #ffffff; border: 2px solid #15803d; box-shadow: 0 4px 10px rgba(21, 128, 61, 0.2); outline: none; }
  
  .status-group { display: flex; gap: 15px; justify-content: center; }
  .status-group label { font-size: 13px; font-weight: bold; cursor: pointer; display: flex; align-items: center; gap: 4px; }
  .status-good { color: #16a34a; }
  .status-bad { color: #dc2626; }

  .btn-submit { display: block; width: 100%; padding: 14px; background: #15803d; color: white; font-weight: bold; font-size: 16px; border: none; border-radius: 8px; cursor: pointer; margin-top: 10px; }
  .btn-submit:disabled { background: #94a3b8; }

  /* Dashboard Card Layout Styles */
  .dash-header-card { background: #d97706; color: white; padding: 15px; border-radius: 8px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
  .dash-header-card h3 { margin: 0; font-size: 18px; font-weight: 800; text-transform: uppercase; }
  .dash-header-card p { margin: 3px 0 0 0; font-size: 12px; opacity: 0.9; }
  .btn-print-main { background: #ffffff; color: #0f172a; border: none; padding: 8px 12px; font-weight: bold; border-radius: 6px; cursor: pointer; font-size: 13px; }

  .log-card { background: #ffffff; border-radius: 10px; padding: 15px; margin-bottom: 15px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); border: 1px solid #e2e8f0; position: relative; border-left: 6px solid #16a34a; }
  .log-card.has-fault { border-left-color: #dc2626; background: #fff5f5; }
  
  .card-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
  .card-title { font-size: 18px; font-weight: 800; color: #1e293b; }
  .badge-status { padding: 4px 10px; border-radius: 6px; font-size: 12px; font-weight: 800; letter-spacing: 0.5px; text-transform: uppercase; }
  .badge-passed { background: #16a34a; color: white; }
  .badge-attention { background: #dc2626; color: white; }

  .card-details { font-size: 13px; color: #334155; line-height: 1.6; }
  .card-details div { margin-bottom: 2px; }
  .fault-text { color: #dc2626; font-weight: bold; }
  
  .card-actions { display: flex; gap: 8px; margin-top: 10px; }
  .btn-print-report { flex: 2; text-align: center; background: #0284c7; color: white; padding: 10px; font-weight: bold; font-size: 14px; border: none; border-radius: 6px; cursor: pointer; text-decoration: none; }
  .btn-delete-report { flex: 1; text-align: center; background: #dc2626; color: white; padding: 10px; font-weight: bold; font-size: 14px; border: none; border-radius: 6px; cursor: pointer; }
  
  @media print {
    .tabs, .btn-submit, .card-actions, .btn-print-main { display: none !important; }
    body { background: white; margin: 0; }
    .container { box-shadow: none; border: none; max-width: 100%; padding: 0; }
  }
</style>
</head>
<body>

<div class="container">
  <div class="tabs">
    <button class="tab-btn active" onclick="switchTab('check')">📋 Pre-Check List</button>
    <button class="tab-btn" onclick="switchTab('dashboard')">📊 Live Dashboard</button>
    <button class="tab-btn" onclick="switchTab('settings')">⚙️ Settings</button>
  </div>

  <!-- TAB 1: PRE-CHECK FORM -->
  <div id="tab-check" class="tab-content active">
    <h2>FORKLIFT PRE-CHECK LIST</h2>
    <p class="company-sub">LION BEER COMPANY (PVT) LTD</p>

    <div class="grid-fields">
      <div class="field">
        <label>FORKLIFT NUMBER:</label>
        <select id="forkliftNo"></select>
      </div>
      <div class="field">
        <label>FORKLIFT MODEL:</label>
        <div class="pill-group" id="modelGroup"></div>
      </div>
      <div class="field">
        <label>FORKLIFT OWNER:</label>
        <div class="pill-group" id="ownerGroup"></div>
      </div>
      <div class="field">
        <label>SHIFT TIME:</label>
        <select id="shiftTime">
          <option value="Day Shift (06:00 AM - 06:00 PM)">Day Shift (06:00 AM - 06:00 PM)</option>
          <option value="Night Shift (06:00 PM - 06:00 AM)">Night Shift (06:00 PM - 06:00 AM)</option>
        </select>
      </div>
      <div class="field" style="grid-column: 1 / -1;">
        <label>SELECT DATE: <span id="selectedDateDisplay" style="color:#15803d; font-weight:bold;"></span></label>
        <div class="date-scroll-wrap" id="dateButtons"></div>
      </div>
      <div class="field">
        <label>MILEAGE / METER (KM):</label>
        <input type="number" id="mileageInput" placeholder="Enter Mileage">
      </div>
      <div class="field">
        <label>OPERATOR NAME / EPF NO:</label>
        <input type="text" id="operatorInput" placeholder="Name or EPF">
      </div>
      <div class="field">
        <label>SUPERVISOR NAME:</label>
        <select id="supervisorSelect"></select>
      </div>
    </div>

    <table>
      <thead>
        <tr>
          <th style="width: 10%;">SN</th>
          <th style="width: 55%;">CHECKS</th>
          <th style="width: 35%;">CONDITION</th>
        </tr>
      </thead>
      <tbody id="checkListBody"></tbody>
    </table>

    <div class="field" style="margin-bottom: 15px;">
      <label style="font-weight: bold; font-size: 14px; color: #78350f;">OVERALL REMARKS:</label>
      <textarea id="overallRemarks" class="remark-input" placeholder="Type overall remarks here..."></textarea>
    </div>

    <button class="btn-submit" id="submitBtn">SUBMIT CHECKLIST</button>
  </div>

  <!-- TAB 2: LIVE DASHBOARD -->
  <div id="tab-dashboard" class="tab-content">
    <div class="dash-header-card">
      <div>
        <h3>FORKLIFT PRE-CHECK LOGS</h3>
        <p>Lion Beer Company Management Dashboard</p>
      </div>
      <button class="btn-print-main" onclick="window.print()">Print / Save PDF</button>
    </div>

    <div id="cardLogsContainer">
      <div style="text-align:center; padding:30px; color:#64748b;">Loading Live Inspection Logs...</div>
    </div>
  </div>

  <!-- TAB 3: SETTINGS -->
  <div id="tab-settings" class="tab-content">
    <h2>SETTINGS</h2>
    <div class="grid-fields" style="grid-template-columns: 1fr;">
      <div class="field">
        <label>SET YEAR:</label>
        <select id="setYear">
          <option value="2026">2026</option>
          <option value="2027">2027</option>
          <option value="2028">2028</option>
        </select>
      </div>
      <div class="field">
        <label>SET MONTH:</label>
        <select id="setMonth">
          <option value="1">January</option><option value="2">February</option><option value="3">March</option>
          <option value="4">April</option><option value="5">May</option><option value="6">June</option>
          <option value="7">July</option><option value="8">August</option><option value="9">September</option>
          <option value="10">October</option><option value="11">November</option><option value="12">December</option>
        </select>
      </div>
      <div class="field">
        <label>FORKLIFT MODELS (Commas වලින් වෙන් කරන්න):</label>
        <input type="text" id="setModels" placeholder="e.g. Battery, Gas, Diesel, Petrol">
      </div>
      <div class="field">
        <label>FORKLIFT OWNERS (Commas වලින් වෙන් කරන්න):</label>
        <input type="text" id="setOwners" placeholder="e.g. Winwill, Tasma, Other">
      </div>
      <div class="field">
        <label>SUPERVISOR NAMES (Commas වලින් වෙන් කරන්න):</label>
        <input type="text" id="setSupervisors" placeholder="e.g. SANJEEWA, ANITH">
      </div>
    </div>
    <button class="btn-submit" onclick="saveSettings()">Save Settings</button>
  </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getDatabase, ref, push, set, get, remove, query, limitToLast } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyCeDKeig25MB0iwawWna2891Fx52wM7Jyk",
    authDomain: "forkliftapp-6ca94.firebaseapp.com",
    databaseURL: "https://forkliftapp-6ca94-default-rtdb.firebaseio.com",
    projectId: "forkliftapp-6ca94",
    storageBucket: "forkliftapp-6ca94.firebasestorage.app",
    messagingSenderId: "571222355847",
    appId: "1:571222355847:web:67cb10919b7e1d3b0f2d22",
    measurementId: "G-5NBG4590TH"
  };

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);

  // Google Apps Script Web App URL
  const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwLFPqRRvgbLeSncuKA-c3WJiiRi9GX5gxlVjc9I2n4uz6ID5I8HVUO937_anHmtZqqAA/exec";

  // Function to send data to Google Sheet
  function sendDataToGoogleSheet(formData) {
    fetch(GOOGLE_SCRIPT_URL, {
      method: "POST",
      mode: "no-cors",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify(formData)
    })
    .then(() => {
      console.log("Logged to Google Sheet successfully!");
    })
    .catch((error) => {
      console.error("Error logging to Google Sheet:", error);
    });
  }

  let appSettings = JSON.parse(localStorage.getItem('forklift_settings')) || {
    year: "2026",
    month: "9",
    models: "Gas, Battery, Diesel, Petrol",
    owners: "Winwill, Tasma, Other",
    supervisors: "SANJEEWA, ANITH"
  };

  let selectedDay = new Date().getDate();

  const items = [
    "Head lights", "Signal lights", "Break lights", "Reverse lights", "Parking lights",
    "Spinning light", "Horn working", "Safety belts", "Windshield clean", "Side mirrors condition",
    "Fork movement", "Reverse horn", "Brake check", "Any exterior damage", "All tires' conditions",
    "Battery condition", "Any leakages", "Power steering", "Hand brake",
    "Workability of handles & locks are satisfactory", "Mileage Check"
  ];

  window.init = function() {
    const flSelect = document.getElementById('forkliftNo');
    flSelect.innerHTML = '';
    for(let i=1; i<=30; i++) {
      let num = String(i).padStart(2, '0');
      flSelect.innerHTML += `<option value="FL ${num}">FL ${num}</option>`;
    }

    document.getElementById('setYear').value = appSettings.year;
    document.getElementById('setMonth').value = appSettings.month;
    document.getElementById('setModels').value = appSettings.models;
    document.getElementById('setOwners').value = appSettings.owners;
    document.getElementById('setSupervisors').value = appSettings.supervisors;

    renderDynamicFields();
    renderDateButtons();
    renderChecklist();
  }

  function renderDynamicFields() {
    const modelGroup = document.getElementById('modelGroup');
    modelGroup.innerHTML = '';
    const models = appSettings.models.split(',');
    models.forEach((mod, idx) => {
      let m = mod.trim();
      if(m) {
        modelGroup.innerHTML += `
          <div class="pill-item">
            <input type="radio" id="mod_${idx}" name="model" value="${m}" ${idx === 0 ? 'checked' : ''}>
            <label for="mod_${idx}">${m}</label>
          </div>`;
      }
    });

    const ownerGroup = document.getElementById('ownerGroup');
    ownerGroup.innerHTML = '';
    const owners = appSettings.owners.split(',');
    owners.forEach((own, idx) => {
      let o = own.trim();
      if(o) {
        ownerGroup.innerHTML += `
          <div class="pill-item">
            <input type="radio" id="own_${idx}" name="owner" value="${o}" ${idx === 0 ? 'checked' : ''}>
            <label for="own_${idx}">${o}</label>
          </div>`;
      }
    });

    const supeSelect = document.getElementById('supervisorSelect');
    supeSelect.innerHTML = '';
    const names = appSettings.supervisors.split(',');
    names.forEach(name => {
      if(name.trim()) supeSelect.innerHTML += `<option value="${name.trim()}">${name.trim()}</option>`;
    });
  }

  function renderDateButtons() {
    const year = Number(appSettings.year);
    const month = Number(appSettings.month);
    const totalDays = new Date(year, month, 0).getDate();
    const container = document.getElementById('dateButtons');
    container.innerHTML = '';
    
    if(selectedDay > totalDays) selectedDay = 1;

    for(let d=1; d<=totalDays; d++) {
      const btn = document.createElement('button');
      btn.className = `date-btn ${d === selectedDay ? 'active' : ''}`;
      btn.textContent = d;
      btn.onclick = () => {
        selectedDay = d;
        renderDateButtons();
      };
      container.appendChild(btn);
    }

    const monthNames = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
    document.getElementById('selectedDateDisplay').textContent = `${appSettings.year} ${monthNames[month-1]} ${String(selectedDay).padStart(2, '0')}`;
  }

  function renderChecklist() {
    const tbody = document.getElementById('checkListBody');
    tbody.innerHTML = '';
    items.forEach((item, index) => {
      const sn = String(index + 1).padStart(2, '0');
      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td style="text-align: center; font-weight: bold;">${sn}</td>
        <td><b>${item}</b></td>
        <td>
          <div class="status-group">
            <label class="status-good"><input type="radio" name="st_${index}" value="Good" checked> Good</label>
            <label class="status-bad"><input type="radio" name="st_${index}" value="Not Good"> Not Good</label>
          </div>
        </td>
      `;
      tbody.appendChild(tr);
    });
  }

  window.switchTab = function(tab) {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
    
    if(tab === 'check') {
      document.querySelectorAll('.tab-btn')[0].classList.add('active');
      document.getElementById('tab-check').classList.add('active');
    } else if(tab === 'dashboard') {
      document.querySelectorAll('.tab-btn')[1].classList.add('active');
      document.getElementById('tab-dashboard').classList.add('active');
      window.fetchDashboardData();
    } else {
      document.querySelectorAll('.tab-btn')[2].classList.add('active');
      document.getElementById('tab-settings').classList.add('active');
    }
  }

  window.saveSettings = function() {
    appSettings.year = document.getElementById('setYear').value;
    appSettings.month = document.getElementById('setMonth').value;
    appSettings.models = document.getElementById('setModels').value;
    appSettings.owners = document.getElementById('setOwners').value;
    appSettings.supervisors = document.getElementById('setSupervisors').value;
    
    localStorage.setItem('forklift_settings', JSON.stringify(appSettings));
    renderDynamicFields();
    renderDateButtons();
    alert("Settings Saved Successfully!");
    switchTab('check');
  }

  // Dashboard Loader with Time Lock Check
  window.fetchDashboardData = async function() {
    const container = document.getElementById('cardLogsContainer');
    container.innerHTML = '<div style="text-align:center; padding:30px; color:#64748b;">Loading Live Inspection Logs...</div>';
    
    try {
      const q = query(ref(db, 'checklists'), limitToLast(30));
      const snapshot = await get(q);
      
      if(!snapshot.exists()) {
        container.innerHTML = '<div style="text-align:center; padding:30px; color:#64748b;">No inspection logs submitted yet.</div>';
        return;
      }
      
      container.innerHTML = '';
      let logs = [];
      snapshot.forEach(child => {
        logs.unshift({ key: child.key, ...child.val() });
      });

      const currentTime = new Date().getTime();
      const ALLOWED_DELETE_HOURS = 24;

      logs.forEach(log => {
        let defectsList = [];
        if(log.checks) {
          for (const [key, val] of Object.entries(log.checks)) {
            if(val === "Not Good") defectsList.push(key);
          }
        }

        const isFaulty = log.hasIssue || defectsList.length > 0;
        const statusBadge = isFaulty 
          ? `<span class="badge-status badge-attention">ATTENTION REQUIRED</span>` 
          : `<span class="badge-status badge-passed">PASSED</span>`;

        const faultsRow = isFaulty 
          ? `<div><span class="fault-text">Faults Detected:</span> ${defectsList.join(', ')}</div>` 
          : '';

        // Calculate Time Difference for Delete Lock
        const logTime = log.timestamp ? new Date(log.timestamp).getTime() : 0;
        const hoursPassed = (currentTime - logTime) / (1000 * 60 * 60);
        
        // Show delete button ONLY if submitted within last 24 hours
        const deleteBtnHtml = (logTime > 0 && hoursPassed <= ALLOWED_DELETE_HOURS)
          ? `<button class="btn-delete-report" onclick="deleteLog('${log.key}', ${hoursPassed})">🗑️ Delete</button>`
          : `<span style="font-size:11px; color:#94a3b8; align-self:center; font-weight:bold;">🔒 Record Locked</span>`;

        const card = document.createElement('div');
        card.className = `log-card ${isFaulty ? 'has-fault' : ''}`;
        card.innerHTML = `
          <div class="card-top">
            <div class="card-title">${log.forkliftNo || 'FL'} ${log.model ? `(${log.model})` : ''}</div>
            ${statusBadge}
          </div>
          <div class="card-details">
            <div><b>Date:</b> ${log.date || '-'} | <b>Shift:</b> ${log.shift || '-'}</div>
            <div><b>Operator:</b> ${log.operator || '-'} | <b>Supervisor:</b> ${log.supervisor || '-'}</div>
            <div><b>Owner:</b> ${log.owner || '-'} | <b>Mileage:</b> ${log.mileage || '0'} KM</div>
            ${faultsRow}
            <div><b>Remarks:</b> ${log.overallRemarks || (isFaulty ? 'Not Good' : 'Good')}</div>
          </div>
          <div class="card-actions">
            <button class="btn-print-report" onclick="window.print()">Print Report</button>
            ${deleteBtnHtml}
          </div>
        `;
        container.appendChild(card);
      });

    } catch(err) {
      container.innerHTML = `<div style="text-align:center; padding:30px; color:red;">Error loading logs: ${err.message}</div>`;
    }
  }

  // Security Checked Delete Function
  window.deleteLog = async function(key, hoursPassed) {
    if (hoursPassed > 24) {
      alert(" This report is older than 24 hours and is permanently locked. It cannot be deleted.");
      return;
    }

    if (confirm("Are you sure you want to delete this report? (Available only within 24 hours of entry)")) {
      try {
        await remove(ref(db, `checklists/${key}`));
        alert("Log Deleted Successfully!");
        window.fetchDashboardData();
      } catch (err) {
        alert("Delete failed: " + err.message);
      }
    }
  }

  document.getElementById('submitBtn').addEventListener('click', async () => {
    const submitBtn = document.getElementById('submitBtn');
    submitBtn.disabled = true;
    submitBtn.textContent = "SUBMITTING...";

    const monthNames = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
    const formattedDate = `${appSettings.year}-${monthNames[Number(appSettings.month)-1]}-${String(selectedDay).padStart(2, '0')}`;

    const checkResults = {};
    let hasBadCondition = false;
    let reportedFaultsArr = [];

    items.forEach((item, index) => {
      const checkedVal = document.querySelector(`input[name="st_${index}"]:checked`).value;
      checkResults[item] = checkedVal;
      if(checkedVal === "Not Good") {
        hasBadCondition = true;
        reportedFaultsArr.push(item);
      }
    });

    const selectedModel = document.querySelector('input[name="model"]:checked') ? document.querySelector('input[name="model"]:checked').value : '';
    const selectedOwner = document.querySelector('input[name="owner"]:checked') ? document.querySelector('input[name="owner"]:checked').value : '';
    const overallRemarksVal = document.getElementById('overallRemarks').value;

    const payload = {
      timestamp: new Date().toISOString(),
      date: formattedDate,
      forkliftNo: document.getElementById('forkliftNo').value,
      model: selectedModel,
      owner: selectedOwner,
      shift: document.getElementById('shiftTime').value,
      mileage: document.getElementById('mileageInput').value,
      operator: document.getElementById('operatorInput').value,
      supervisor: document.getElementById('supervisorSelect').value,
      checks: checkResults,
      hasIssue: hasBadCondition,
      overallRemarks: overallRemarksVal
    };

    try {
      // 1. Save to Firebase
      const logsRef = ref(db, 'checklists');
      const newLogRef = push(logsRef);
      await set(newLogRef, payload);

      // 2. Send to Google Sheet & Trigger Email Alert
      const sheetPayload = {
        forkliftNo: payload.forkliftNo,
        shift: payload.shift,
        operator: payload.operator,
        status: hasBadCondition ? "ATTENTION REQUIRED" : "PASSED",
        faults: reportedFaultsArr.length > 0 ? reportedFaultsArr.join(', ') : "None",
        remarks: overallRemarksVal || (hasBadCondition ? "Not Good" : "Good")
      };
      sendDataToGoogleSheet(sheetPayload);

      alert("Checklist Submitted Successfully!");
      submitBtn.disabled = false;
      submitBtn.textContent = "SUBMIT CHECKLIST";
      document.getElementById('overallRemarks').value = '';
      document.getElementById('mileageInput').value = '';

      switchTab('dashboard');
    } catch (error) {
      alert("Submission Error: " + error.message);
      submitBtn.disabled = false;
      submitBtn.textContent = "SUBMIT CHECKLIST";
    }
  });

  window.init();
</script>
</body>
</html>
